name: Deploy to Gumroad

on:
  push:
    branches:
      - main

# 1. Define the environment variable globally here
env:
  GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Gumroad CLI
        run: |
          curl -sSL https://githubusercontent.com | sh
          echo "$HOME/.gumroad/bin" >> $GITHUB_PATH

      # 2. Every command below will now automatically inherit GUMROAD_ACCESS_TOKEN
       Sir, replace this step with your exact deployment command
      - name: Run Deployment
        run: |
          gumroad user page publish ./landing.html --json --no-interactive




