name: Deploy to Gumroad

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Gumroad CLI
        run: |
          curl -fsSL https://gumroad.com | bash
          echo "$HOME/.gumroad/bin" >> $GITHUB_PATH

      - name: Authenticate and Run Deployment
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          echo "${{ secrets.GUMROAD_ACCESS_TOKEN }}" | $HOME/.gumroad/bin/gumroad auth login --with-token
          $HOME/.gumroad/bin/gumroad user page publish ./landing.html --json


